<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Partnership Under Pressure | SPMT 470</title><style>

:root{font-family:Arial,Helvetica,sans-serif;color:#281b22;background:#f8f5f5}*{box-sizing:border-box}body{margin:0;line-height:1.55;background:linear-gradient(180deg,#220f18 0,#500000 280px,#f8f5f5 281px)}header{background:linear-gradient(120deg,#220f18,#500000 65%,#7e4354);color:#f8f5f5;padding:27px max(20px,calc((100vw - 960px)/2));border-bottom:3px solid #b7a7b2}header h1{margin:0;font-size:1.85rem;letter-spacing:.015em}header p{margin:4px 0;color:#f0dfe5}main{max-width:960px;margin:24px auto;padding:0 16px 50px}.panel{background:#fff;border:1px solid #d6c6ce;border-radius:14px;padding:26px;margin:14px 0;box-shadow:0 12px 35px #220f181a}.notice{border-left:5px solid #7e4354;background:#f7eff2;padding:13px}.warning{border-left:5px solid #500000;background:#f8eef0;padding:13px}h2{margin-top:0;color:#500000}h3{margin-bottom:8px;color:#500000}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choice{border:2px solid #b7a7b2;border-radius:9px;padding:14px;cursor:pointer;display:block;background:#fff}.choice:has(input:checked){border-color:#500000;background:#f7eff2}.choice input{accent-color:#500000}.choice strong{display:block;margin:4px 0}.choice p{font-size:.92rem}button{background:#500000;color:white;border:2px solid #500000;border-radius:7px;padding:11px 18px;font-size:1rem;cursor:pointer;font-weight:700}button.secondary{background:white;color:#500000}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #aa6b28;outline-offset:3px}input[type=text],textarea{width:100%;border:1px solid #75626e;border-radius:5px;padding:10px;font:inherit}textarea{min-height:95px}label.field{display:block;font-weight:bold;margin:14px 0 5px}.muted{color:#594952}.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.tag{display:inline-block;background:#f1e7ec;border-radius:4px;padding:3px 8px;font-size:.88rem}.feedback{border-left:4px solid #500000;padding-left:14px;margin:16px 0}.feedback p{margin:7px 0}.step{font-weight:bold;color:#7e4354;text-transform:uppercase;letter-spacing:.06em;font-size:.87rem}.report-section{border-top:1px solid #d6c6ce;padding-top:10px;margin-top:18px}ul{padding-left:23px}a{color:#64152a;text-underline-offset:3px}#app[aria-busy=true]{opacity:.8}.cinema{background:linear-gradient(105deg,#220f18,#500000 62%,#7e4354);color:#f8f5f5;padding:30px 26px;border-radius:11px;margin:0 0 24px;position:relative;overflow:hidden}.cinema:after{content:'✦';position:absolute;right:25px;top:8px;font-size:100px;opacity:.10}.cinema h2{color:#fff;font-size:2rem;max-width:600px;margin:0 0 8px}.cinema p{max-width:680px}.cinema a{color:#fff}.photo-sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.photo-tile{background:#f6f0f3;border:1px solid #d6c6ce;border-radius:9px;padding:15px;min-height:155px}.photo-tile .eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:#674c59;font-weight:bold}.photo-tile strong{display:block;color:#500000;margin:8px 0}.photo-tile p{font-size:.88rem;margin:5px 0}.photo-note{font-size:.85rem;color:#594952}.photo-tile a{font-weight:bold}@media(max-width:700px){.choices,.photo-sources{grid-template-columns:1fr}.panel{padding:17px}header h1{font-size:1.4rem}.cinema{padding:24px 18px}.cinema h2{font-size:1.6rem}}@media print{body{background:white;color:black;font-size:11pt}header,.noprint,.photo-sources,.cinema{display:none!important}main{margin:0;padding:0;max-width:none}.panel{border:0;padding:0;margin:0;box-shadow:none}.report-section{break-inside:avoid}.notice{background:white;border:1px solid black}h1,h2,h3{break-after:avoid;color:black}textarea{border:0}}

.tamu{width:190px;max-width:55%;height:auto;display:block;margin:0 0 18px}video{display:block;max-width:100%;background:#220f18;border:3px solid #7e4354;border-radius:9px;aspect-ratio:16/9}details{margin:16px 0 24px;border:1px solid #7e4354;border-radius:8px;padding:12px;background:#f8f5f5}summary{cursor:pointer;color:#500000}.transcript{max-width:74ch}.choice{color:#281b22;background:#fff;border:2px solid #7e4354}.choice:has(input:checked){background:#500000;color:#fff;border-color:#220f18;outline:3px solid #7e4354;outline-offset:2px}.choice:has(input:checked) p,.choice:has(input:checked) strong{color:#fff}.choice:focus-within{outline:4px solid #aa6b28;outline-offset:3px}button:hover:not(:disabled){background:#220f18;color:#fff}button.secondary:hover:not(:disabled){background:#500000;color:#fff}button:disabled{opacity:1;background:#ded8dc;color:#493a42;border-color:#75626e}#setup{scroll-margin-top:18px}a:focus-visible,button:focus-visible,summary:focus-visible,video:focus-visible{outline:4px solid #aa6b28;outline-offset:4px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media print{video,details,.tamu{display:none!important}}
</style></head><body><header class="noprint"><h1>The Partnership Under Pressure: Let Them Reign</h1><p>SPMT 470 • Worksheet 11.2 • Group decision simulation</p></header><main id="app" aria-live="polite"></main><script>
'use strict';
const D1=[{id:'A',title:'Lead with the fundraising product',desc:'Explain the chocolate fundraising process and how organizations participate, with a brief athlete connection.',up:'Clear sponsor information and a practical next step.',down:'The athlete’s distinctive personal story may become secondary.'},{id:'B',title:'Lead with Samuels’s journey',desc:'Propose a personal-story concept based on the documented youth fundraising connection, subject to athlete review and approval.',up:'A credible connection to the athlete’s documented background.',down:'Viewers may remember the athlete but not the fundraising process.'},{id:'C',title:'Lead with young fundraisers',desc:'Feature consenting youth fundraisers and practical program information, with a supporting athlete contribution.',up:'Community relevance and visible audience benefit.',down:'Permissions, production demands, and role clarity become more complex.'}];
const D2=[{id:'A',title:'Explain',desc:'Add accessible information explaining the partnership’s purpose and how fundraising works.',up:'Efficient clarification of important facts.',down:'Information alone may not change participation.'},{id:'B',title:'Demonstrate',desc:'Pilot an appropriately authorized workshop or digital demonstration of the fundraising process.',up:'Practical audience value and observable participation.',down:'More resources and self-selected participants limit conclusions.'},{id:'C',title:'Listen and refine',desc:'Interview prospective organizers, identify confusing elements, and revise the remaining content.',up:'Responsiveness to specific audience questions.',down:'Slower delivery and a small, nonrepresentative interview sample.'}];
const D3=[{id:'A',title:'Renew with safeguards',desc:'Recommend another campaign period with clear deliverables, creative review, and stronger measurement.',up:'Preserves the documented athlete–brand connection.',down:'Commits resources before incremental impact is established.'},{id:'B',title:'Revise and test',desc:'Recommend a limited pilot with a defined audience, outcomes, and feasible comparison.',up:'Allows more targeted learning and improvement.',down:'Takes time; a small test may remain inconclusive.'},{id:'C',title:'Conclude after obligations',desc:'End the hypothetical extension professionally, documenting what was learned.',up:'Avoids new commitments under uncertainty.',down:'May forego future value from a credible relationship.'}];
const branch2={A:'In a fictional preview, some viewers understand the fundraising offer but cannot explain why this athlete was selected.',B:'In a fictional preview, some viewers remember the personal story but cannot explain how to begin a fundraiser.',C:'In a fictional preview, some viewers appreciate the community focus but want clearer participation requirements and the athlete’s role.'};
const evidence1={A:'Sponsor-message clarity was documented in the fictional preview; the distinctiveness of the athlete connection remains less clear.',B:'The fictional preview suggests personal-story recall; understanding of the fundraising process is less certain.',C:'The fictional preview recognized community relevance; implementation demands and attribution remain concerns.'};
const evidence2={A:'The team delivered additional information; no behavioral impact was established.',B:'A practical demonstration took place; attendance was self-selected and cannot establish incremental participation.',C:'Feedback informed revisions; the revised content has not undergone a strong outcome evaluation.'};
const state={stage:0,team:'',members:'',choice:['','',''],rationale:['','',''],reflections:['','','',''],lead:['Athlete advocate','Sponsor strategist','Audience advocate'],error:''};
const app=document.getElementById('app');
const choiceOrder=[D1,D2,D3].map(items=>items.map(x=>x.id).sort(()=>Math.random()-.5));
function shuffleOrders(){choiceOrder.forEach((a,i)=>{for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}});}
shuffleOrders();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){window.scrollTo(0,0);if(state.stage===0)start();else if(state.stage>=1&&state.stage<=3)round(state.stage);else if(state.stage===4)feedback(3);else if(state.stage===5)reflection();else report();}
function base(inner){app.innerHTML='<section class="panel">'+inner+'</section>';}
function disclaimer(){return '<div class="notice"><strong>Fact vs. fiction:</strong> Malia Samuels and World’s Finest Chocolate announced a real NIL partnership, “Let Them Reign”; the athlete’s prior youth-sport fundraising connection is documented in the sponsor’s announcement. All agency negotiations, preview reactions, extensions, observations, outcomes, and recommendations in this exercise are <strong>invented instructional scenarios</strong>, not claims about the actual parties. This independent exercise is not endorsed by them.</div>';}
function start(){base(`<div class="cinema noprint"><img class="tamu" src="RBG-TAM-White.svg" alt="Texas A&amp;M University"/><p class="step" style="color:#f1d9e1">SPMT 470 · Real NIL partnership / fictional teaching scenario</p><h2>THE PARTNERSHIP UNDER PRESSURE</h2><p>LET THEM REIGN · Malia Samuels × World’s Finest Chocolate</p></div><h2>Watch the agency briefing</h2><p>75-second original text-and-doodle animation. Sound is off by default; turn it on using the video control if you wish. No narration.</p><video id="briefing" controls muted playsinline preload="metadata" width="100%" aria-label="Agency briefing animation"><source src="briefing.mp4" type="video/mp4"><track kind="captions" src="captions.vtt" srclang="en" label="English on-screen text" default>Your browser does not support this video. Read the transcript below.</video><div class="row noprint"><button class="secondary" id="skipbrief" type="button">Skip briefing · Go to group setup</button><button class="secondary" id="replaybrief" type="button">Replay video</button></div><details><summary><strong>Read full briefing transcript (accessible alternative)</strong></summary><div class="transcript"><p><strong>The Partnership Under Pressure: Let Them Reign.</strong></p><p><strong>A real partnership:</strong> Malia Samuels and World’s Finest Chocolate announced a Let Them Reign NIL partnership.</p><p><strong>A meaningful connection:</strong> The announcement describes Samuels previously selling the company’s chocolate to support youth basketball.</p><p><strong>Hypothetical classroom scenario:</strong> Imagine your agency managing a fictional six-week extension.</p><p><strong>Three perspectives:</strong> the athlete, the sponsor, and the fundraising community.</p><p><strong>Three decisions:</strong> creative direction, audience response, and the partnership’s future.</p><p>Every strategy has tradeoffs. Consider consequences and defend your reasoning. You’re the agency. What will you recommend?</p></div></details><div id="setup"><p class="step">Group setup · Approximately 50-minute activity</p><h2>You are the partnership management team</h2>${disclaimer()}<p>Your team will make three consequential decisions and explain each recommendation. Discuss athlete, sponsor, and audience perspectives; do not assume preview reactions prove sales or impact.</p><p><strong>Group roles:</strong> athlete advocate, sponsor strategist, audience advocate, and evidence analyst. Rotate the decision lead between rounds.</p><label class="field" for="team">Group name</label><input id="team" type="text" maxlength="100" value="${esc(state.team)}"><label class="field" for="members">Student names and initial roles</label><textarea id="members" maxlength="800">${esc(state.members)}</textarea><p id="error" role="alert"></p><div class="row"><button id="begin">Begin Decision 1</button></div><p class="muted">Reference: <a href="https://www.prnewswire.com/news-releases/worlds-finest-chocolate-expands-let-them-reign-campaign-into-womens-college-basketball-with-indiana-universitys-malia-samuels-302913822.html" target="_blank" rel="noopener noreferrer">World’s Finest Chocolate partnership announcement (external link)</a>.</p></div>`);document.getElementById('skipbrief').onclick=()=>{let v=document.getElementById('briefing');v.pause();document.getElementById('setup').scrollIntoView({behavior:'instant'});document.getElementById('team').focus();};document.getElementById('replaybrief').onclick=()=>{let v=document.getElementById('briefing');v.currentTime=0;v.play();};document.getElementById('begin').onclick=()=>{let t=document.getElementById('team').value.trim(),m=document.getElementById('members').value.trim();if(!t||!m){document.getElementById('error').textContent='Enter a group name and student names before continuing.';return;}state.team=t;state.members=m;state.stage=1;render();};}
function opts(items,idx){return '<fieldset><legend><strong>Choose one response</strong></legend><div class="choices">'+choiceOrder[idx].map(id=>items.find(x=>x.id===id)).map(x=>'<label class="choice"><input type="radio" name="choice" value="'+x.id+'" '+(state.choice[idx]===x.id?'checked':'')+'><strong>'+esc(x.title)+'</strong><p>'+esc(x.desc)+'</p><p><strong>Benefit:</strong> '+esc(x.up)+'</p><p><strong>Tradeoff:</strong> '+esc(x.down)+'</p></label>').join('')+'</div></fieldset>';}
function round(n){let idx=n-1,items=[D1,D2,D3][idx];let title=['Which story should lead?','Can you make the message useful?','Should the partnership continue?'][idx];let scenario=n===1?'The agency is planning content for a fictional campaign extension. The sponsor wants clear information about its fundraising program. Your team also wants to preserve the athlete’s documented personal connection.':n===2?branch2[state.choice[0]]:'The fictional six-week extension is ending. Your team has a mixed evidence brief. Decide what to recommend.';let extra=n===3?'<div class="notice"><strong>Fictional evidence brief:</strong><p>'+esc(evidence1[state.choice[0]])+'</p><p>'+esc(evidence2[state.choice[1]])+'</p><p><strong>Common limitation:</strong> There is no credible comparison group. Incremental fundraising participation, sales, and return on investment have not been established.</p></div>':'';let q=['Which audience need and stakeholder objective are you prioritizing? What are you giving up?','What specific communication problem are you solving, and why is your response proportionate to the evidence?','What evidence supports your recommendation, what remains unknown, and what finding would change your mind?'][idx];base('<p class="step">Decision '+n+' of 3 • Lead: '+esc(state.lead[idx])+'</p><h2>'+title+'</h2>'+disclaimer()+'<p>'+esc(scenario)+'</p>'+extra+opts(items,idx)+'<label class="field" for="rationale">Discuss first, then record your group rationale</label><p>'+q+'</p><textarea id="rationale" maxlength="2500">'+esc(state.rationale[idx])+'</textarea><p id="error" role="alert"></p><div class="row"><button id="submit">Confirm decision</button></div>');document.getElementById('submit').onclick=()=>{let selected=document.querySelector('input[name="choice"]:checked'),reason=document.getElementById('rationale').value.trim();if(!selected||reason.length<20){document.getElementById('error').textContent='Select an option and write at least 20 characters explaining your group’s reasoning.';return;}state.choice[idx]=selected.value;state.rationale[idx]=reason;state.stage=n===3?4:n+0.5;feedback(n);};}
function feedback(n){let idx=n-1,chosen=[D1,D2,D3][idx].find(x=>x.id===state.choice[idx]);let athlete=n===1?({A:'Her documented connection may receive limited attention; review and consent remain essential.',B:'Her experience anchors the message; proposed first-person language must be reviewed and approved.',C:'Her role supports the community story, but expectations and youth-participant safeguards require agreement.'}[chosen.id]):n===2?({A:'Clarification may help her story be understood, but can feel overly scripted.',B:'A demonstration can offer meaningful interaction, subject to reasonable commitments and approval.',C:'A pause for feedback allows revision without assuming she personally caused confusion.'}[chosen.id]):({A:'Future involvement requires renewed consent and clearly negotiated expectations.',B:'A limited test may reduce obligations but requires specific commitments.',C:'An orderly end can preserve professional relationships and respect existing obligations.'}[chosen.id]);let sponsor=n===1?chosen.up:n===2?chosen.up:n===3?chosen.up:'';let audience=n===1?chosen.down:n===2?chosen.down:chosen.down;let cumulative=n===2?'Earlier content approach: '+D1.find(x=>x.id===state.choice[0]).title+'. '+(state.choice[0]==='A'?'This response should make the athlete connection more visible.':state.choice[0]==='B'?'This response should make participation steps easier to understand.':'This response should clarify organizer requirements and the athlete’s contribution.') :n===3?'Your recommendation follows '+D1.find(x=>x.id===state.choice[0]).title.toLowerCase()+' and '+D2.find(x=>x.id===state.choice[1]).title.toLowerCase()+'. Neither the preview nor the response activity establishes causal campaign impact.':'';base('<p class="step">Decision '+n+' feedback • Fictional possible consequences</p><h2>'+esc(chosen.title)+'</h2><div class="feedback"><p><strong>Athlete:</strong> '+esc(athlete)+'</p><p><strong>Sponsor:</strong> '+esc(sponsor)+'</p><p><strong>Audience:</strong> '+esc(audience)+'</p></div>'+(cumulative?'<p><strong>Connection to earlier decisions:</strong> '+esc(cumulative)+'</p>':'')+'<p class="warning"><strong>Interpretation:</strong> These are teaching assumptions, not real reactions or measured effects. Every choice has costs and benefits.</p><div class="row"><button id="next">'+(n===3?'Continue to group reflection':'Continue to Decision '+(n+1))+'</button></div><p class="muted">Rotate the group decision lead before continuing.</p>');document.getElementById('next').onclick=()=>{state.stage=n===3?5:n+1;render();};}
function reflection(){let prompts=['Which decision created the hardest athlete–sponsor tradeoff?','How did your first decision shape the later situation?','What evidence would you need before confidently recommending another campaign?','Which decision might you reconsider and why?'];base('<p class="step">Group reflection</p><h2>Review your path: '+esc([D1,D2,D3].map((a,i)=>a.find(x=>x.id===state.choice[i]).title).join(' → '))+'</h2><p>Discuss briefly and record concise responses. The final report will include them.</p>'+prompts.map((q,i)=>'<label class="field" for="ref'+i+'">'+(i+1)+'. '+q+'</label><textarea id="ref'+i+'" maxlength="2000">'+esc(state.reflections[i])+'</textarea>').join('')+'<p id="error" role="alert"></p><div class="row"><button id="finish">Generate group report</button></div>');document.getElementById('finish').onclick=()=>{let vals=prompts.map((_,i)=>document.getElementById('ref'+i).value.trim());if(vals.some(v=>v.length<10)){document.getElementById('error').textContent='Please enter a short response to all four questions.';return;}state.reflections=vals;state.stage=6;render();};}
function report(){let path=[D1,D2,D3].map((a,i)=>a.find(x=>x.id===state.choice[i]).title).join(' → ');let chosen=[D1,D2,D3].map((a,i)=>a.find(x=>x.id===state.choice[i]));let prompts=['Hardest tradeoff','Effect of first decision','Evidence needed','Decision to reconsider'];base('<div class="noprint"><p class="step">Complete • Path '+esc(path)+'</p><p>Use your browser’s Print / Save as PDF command. The report is formatted for black-and-white printing.</p><div class="row"><button id="print">Print / Save PDF</button><button class="secondary" id="restart">Replay from beginning</button></div></div><div id="report"><h2>SPMT 470 | Worksheet 11.2 — Group Report</h2><p><strong>The Partnership Under Pressure: Let Them Reign</strong></p>'+disclaimer()+'<p><strong>Group:</strong> '+esc(state.team)+'</p><p><strong>Members and roles:</strong> '+esc(state.members).replace(/\n/g,'<br>')+'</p><p><strong>Path:</strong> '+esc(path)+'</p>'+chosen.map((x,i)=>'<section class="report-section"><h3>Decision '+(i+1)+': '+esc(x.title)+'</h3><p><strong>Group rationale:</strong> '+esc(state.rationale[i]).replace(/\n/g,'<br>')+'</p><p><strong>Opportunity:</strong> '+esc(x.up)+'</p><p><strong>Tradeoff:</strong> '+esc(x.down)+'</p></section>').join('')+'<section class="report-section"><h3>Evidence and limitations (fictional)</h3><p>'+esc(evidence1[state.choice[0]])+'</p><p>'+esc(evidence2[state.choice[1]])+'</p><p>No credible comparison group was established; observed reach, engagement, or participation cannot demonstrate incremental fundraising outcomes or ROI.</p></section><section class="report-section"><h3>Stakeholder summary</h3><p><strong>Athlete:</strong> The plan requires accurate representation, appropriate review and consent, and reasonable obligations.</p><p><strong>Sponsor:</strong> '+esc(chosen[2].up)+' '+esc(chosen[2].down)+'</p><p><strong>Audience:</strong> Practical fundraising information and participation value should be evaluated rather than assumed.</p></section><section class="report-section"><h3>Group reflection</h3>'+prompts.map((p,i)=>'<p><strong>'+esc(p)+':</strong> '+esc(state.reflections[i]).replace(/\n/g,'<br>')+'</p>').join('')+'</section><section class="report-section"><h3>Individual exit response (complete separately)</h3><p>Which decision would you defend to the sponsor, and what evidence might persuade you to change your recommendation?</p><p>____________________________________________________________</p></section></div>');document.getElementById('print').onclick=()=>window.print();document.getElementById('restart').onclick=()=>{if(!confirm('Start a new attempt? Current responses will be cleared. Print or save the report first.'))return;Object.assign(state,{stage:0,team:'',members:'',choice:['','',''],rationale:['','',''],reflections:['','','','']});shuffleOrders();render();};}
render();
</script></body></html>
